services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-price-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-my-secret-backend-token-12345}
      - CMC_API_KEY=${CMC_API_KEY}
      - CMC_BASE_URL=${CMC_BASE_URL:-https://pro-api.coinmarketcap.com}
      - CMC_TIMEOUT_MS=${CMC_TIMEOUT_MS:-10000}
      - DB_PATH=/app/data/crypto_tracker.db
      - BASE_CURRENCY=${BASE_CURRENCY:-USD}
      - SYNC_ENABLED=${SYNC_ENABLED:-true}
      - SYNC_INTERVAL_MS=${SYNC_INTERVAL_MS:-120000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
